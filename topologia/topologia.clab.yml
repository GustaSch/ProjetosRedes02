name: trabalho1
topology:
  nodes:
    r1: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.1/32 dev lo",
      "ip addr add 10.0.12.1/30 dev eth1",
      "ip addr add 10.0.13.1/30 dev eth2",
      "ip addr add 10.0.15.1/30 dev eth3",
      "ip addr add 192.168.1.1/24 dev eth4" ] }
    r2: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.2/32 dev lo",
      "ip addr add 10.0.12.2/30 dev eth1",
      "ip addr add 10.0.24.1/30 dev eth2",
      "ip addr add 10.0.25.1/30 dev eth3" ] }
    r3: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.3/32 dev lo",
      "ip addr add 10.0.13.2/30 dev eth1",
      "ip addr add 10.0.35.1/30 dev eth2",
      "ip addr add 10.0.36.1/30 dev eth3" ] }
    r4: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.4/32 dev lo",
      "ip addr add 10.0.24.2/30 dev eth1",
      "ip addr add 10.0.47.1/30 dev eth2" ] }
    r5: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.5/32 dev lo",
      "ip addr add 10.0.15.2/30 dev eth1",
      "ip addr add 10.0.25.2/30 dev eth2",
      "ip addr add 10.0.35.2/30 dev eth3",
      "ip addr add 10.0.57.1/30 dev eth4" ] }
    r6: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.6/32 dev lo",
      "ip addr add 10.0.36.2/30 dev eth1",
      "ip addr add 10.0.67.1/30 dev eth2" ] }
    r7: { kind: linux, image: router-bird, exec: [
      "sysctl -w net.ipv4.ip_forward=1",
      "ip addr add 10.255.0.7/32 dev lo",
      "ip addr add 10.0.47.2/30 dev eth1",
      "ip addr add 10.0.57.2/30 dev eth2",
      "ip addr add 10.0.67.2/30 dev eth3",
      "ip addr add 192.168.2.1/24 dev eth4" ] }
    h1: { kind: linux, image: router-bird, exec: [
      "ip addr add 192.168.1.10/24 dev eth1",
      "ip route replace default via 192.168.1.1" ] }
    h2: { kind: linux, image: router-bird, exec: [
      "ip addr add 192.168.2.10/24 dev eth1",
      "ip route replace default via 192.168.2.1" ] }
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r1:eth3", "r5:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r2:eth3", "r5:eth2"]
    - endpoints: ["r3:eth2", "r5:eth3"]
    - endpoints: ["r3:eth3", "r6:eth1"]
    - endpoints: ["r4:eth2", "r7:eth1"]
    - endpoints: ["r5:eth4", "r7:eth2"]
    - endpoints: ["r6:eth2", "r7:eth3"]
    - endpoints: ["r1:eth4", "h1:eth1"]
    - endpoints: ["r7:eth4", "h2:eth1"]